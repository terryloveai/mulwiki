<svg width="440" height="440" viewBox="0 0 500 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sg" cx="36%" cy="28%" r="72%">
      <stop offset="0%"   stop-color="#f5f5f5"/>
      <stop offset="45%"  stop-color="#dadada"/>
      <stop offset="88%"  stop-color="#b0b0b0"/>
      <stop offset="100%" stop-color="#999999"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="72%"  stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.14)"/>
    </radialGradient>
    <radialGradient id="specular" cx="34%" cy="26%" r="38%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="shadow" x="-14%" y="-10%" width="128%" height="132%">
      <feDropShadow dx="0" dy="10" stdDeviation="20"
                    flood-color="#000000" flood-opacity="0.20"/>
    </filter>
    <clipPath id="clip">
      <circle cx="250" cy="248" r="220"/>
    </clipPath>
  </defs>

  <!-- Sphere -->
  <circle cx="250" cy="248" r="220" fill="url(#sg)" filter="url(#shadow)"/>
  <circle cx="250" cy="248" r="220" fill="url(#vignette)"/>
  <circle cx="250" cy="248" r="220" fill="url(#specular)"/>

  <!-- Globe lines -->
  <g clip-path="url(#clip)" fill="none" stroke="#6a6a6a" stroke-width="0.9">
    <ellipse cx="250" cy="248" rx="220" ry="22" opacity="0.18"/>
    <ellipse cx="250" cy="180" rx="209" ry="18" opacity="0.12"/>
    <ellipse cx="250" cy="316" rx="209" ry="18" opacity="0.12"/>
    <ellipse cx="250" cy="248" rx="22"  ry="220" opacity="0.08"/>
  </g>

  <!-- M -->
  <polyline
    points="88,248 122,82 250,162 378,82 412,248"
    fill="none" stroke="#0e0e0e" stroke-width="22"
    stroke-linejoin="round" stroke-linecap="round"/>

  <!-- W outer left -->
  <line x1="88"  y1="248" x2="193" y2="424"
        stroke="#0e0e0e" stroke-width="22" stroke-linecap="round"/>
  <!-- W outer right -->
  <line x1="412" y1="248" x2="307" y2="424"
        stroke="#0e0e0e" stroke-width="22" stroke-linecap="round"/>
  <!-- W right inner (drawn under) -->
  <line x1="290" y1="248" x2="193" y2="424"
        stroke="#0e0e0e" stroke-width="22" stroke-linecap="round"/>
  <!-- W left inner (drawn over) -->
  <line x1="210" y1="248" x2="307" y2="424"
        stroke="#0e0e0e" stroke-width="22" stroke-linecap="round"/>

  <!-- Knowledge nexus -->
  <circle cx="250" cy="320" r="10" fill="#1a3fa0"/>
</svg>
